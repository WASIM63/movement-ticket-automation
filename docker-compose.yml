services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-movement_user}:${MYSQL_PASSWORD:-change_me}@db:3306/${MYSQL_DATABASE:-movement_ticket}
      SAP_MODE: ${SAP_MODE:-mock}
    ports:
      - "9000:9000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node dist/main"
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-movement_ticket}
      MYSQL_USER: ${MYSQL_USER:-movement_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_root_me}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-change_root_me}"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  mysql_data:
